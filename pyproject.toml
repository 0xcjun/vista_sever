[project]
name = "vista-fc"
version = "0.1.0"
description = "Aliyun Function Compute wrapper for vista workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # 业务核心 — 从私有源 zbczsc-dev 安装（见 [tool.uv.sources]）
    # 私有传递依赖显式列出，以便 uv sources 路由生效（uv sources 仅作用于直接依赖）
    "vista>=3.2.3",
    "chan-factor-rs>=0.4.1",
    "chanfactor>=0.1.6",
    "wbt>=0.1.6",
    # 数据与契约
    "pydantic>=2.6.0",
    "polars>=1.0.0",
    "duckdb>=0.9.0",
    # 阿里云 SDK
    "oss2>=2.18.0",
    "alibabacloud-fc20230330>=4.0.0",
    # S3 兼容后端（OSS_S3_COMPAT=true 时启用；本地 MinIO / 其他 S3 兼容存储）
    "boto3>=1.34.0",
    # 日志与工具
    "loguru>=0.7.0",
    "tomlkit>=0.13.0",
    "python-dotenv>=1.0.0",
    "agno>=2.1.3",
    "claude-agent-sdk>=0.1.18,<0.1.49",
    "anthropic>=0.96.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.30.0",
    "pytest-benchmark>=4.0.0",
    "syrupy>=4.8.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vista_fc", "handlers"]

# ── uv sources ───────────────────────────────────────────────────────────────
# 目标环境：FC 运行时是 linux，开发机是 darwin；不支持 win32（私有源无 win wheel）。
[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "zbczsc-dev"
url = "https://pypi.zbczsc.com/team/dev/+simple/"
explicit = true

[tool.uv.sources]
# vista 及其私有传递依赖从 zbczsc-dev 私有源解析（该源开放、无需认证）。
# TODO: vista 3.2.3 publish 到 zbczsc-dev 后,把下面 path 改回 { index = "zbczsc-dev" }
vista = { path = "../../cursorPro/vista", editable = true }
chanfactor = { index = "zbczsc-dev" }
chan-factor-rs = { index = "zbczsc-dev" }

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "handlers", "tests"]
extend-exclude = [".venv", "build", "dist", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vista_fc", "handlers"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

# ── basedpyright ─────────────────────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "handlers", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "s_local: integration tests that use `s local invoke` (requires docker + serverless-devs)",
    "slow: slow tests (>5s)",
]
addopts = "-ra --strict-markers"

# ── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src/vista_fc"]
omit = ["tests/*", "handlers/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
