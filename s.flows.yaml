edition: 3.0.0
name: vista-fc-flows

# 函数工作流 (FnF) 部署 — 编排上面 8 个 fc 函数。flow 本身不依赖任何 fc 函数
# 已部署（FnF 启动时会按 resourceArn 找函数，找不到才报错），但实际跑的时候
# 显然你得先把 s.factor-*.yaml / s.deadletter.yaml 都 deploy 上去。
#
# 三个 flow：
#   - research-pipeline:  factor-plan → builder → detect → duplicate → evaluate → filter → backtest
#   - backtest-fanout:    把多份策略 toml 并行喂给 strategy-backtest
#   - research-full:      research-pipeline + 周边边角，端到端

access: ${env.FC_ACCESS|default}

vars:
  region:         ${env.FC_REGION|cn-hangzhou}
  accountId:      ${env.ALIYUN_ACCOUNT_ID}
  fnfRoleArn:     acs:ram::${vars.accountId}:role/fnf-vista-role
  functionSuffix: ${env.FC_SUFFIX|""}

resources:
  research-pipeline-flow:
    component: fnf
    props:
      region:     ${vars.region}
      name:       research-pipeline${vars.functionSuffix}
      type:       FDL
      definition: ${file(./flows/research_pipeline.fdl)}
      roleArn:    ${vars.fnfRoleArn}

  backtest-fanout-flow:
    component: fnf
    props:
      region:     ${vars.region}
      name:       backtest-fanout${vars.functionSuffix}
      type:       FDL
      definition: ${file(./flows/backtest_fanout.fdl)}
      roleArn:    ${vars.fnfRoleArn}

  research-full-flow:
    component: fnf
    props:
      region:     ${vars.region}
      name:       research-full${vars.functionSuffix}
      type:       FDL
      definition: ${file(./flows/research_full.fdl)}
      roleArn:    ${vars.fnfRoleArn}
