edition: 3.0.0
name: vista-fc-realtime-event

# 实盘信号 — 事件触发变体。无 cron，由外部系统通过 SDK 直调
# (fc3 InvokeFunction) 或函数 URL 推 tick 进来。因为没有 cron 持续撑温，
# 单次冷启动 5-15s 不能接受，所以**默认开 1 个预留实例**保持 ~0s 响应。
#
# 与 s.yaml / s.realtime-cron.yaml 完全独立，函数名 vista-realtime-event${suffix}，
# 三套可同时部署、互不干涉。
#
# 计费：1 vCPU + 4 GB 暖实例 24×7 约 200-300 元/月；只在交易时段需要的话
# 加 scheduledActions（详见 docs/PLAYBOOK.md §6）。

access: ${env.FC_ACCESS|default}

vars:
  region:           ${env.FC_REGION|cn-hangzhou}
  accountId:        ${env.ALIYUN_ACCOUNT_ID}
  ossBucket:        ${env.OSS_BUCKET|vista-fc-dev}
  imageRegistry:    registry.${vars.region}.aliyuncs.com/vista/vista-fc-base
  imageTag:         ${env.GIT_SHA|latest}
  nasMountTarget:   ${env.NAS_MOUNT_TARGET}
  vpcId:            ${env.VPC_ID}
  vswitchId:        ${env.VSWITCH_ID}
  securityGroupId:  ${env.SG_ID}
  logProject:       ${env.LOG_PROJECT|vista-fc}
  logStore:         ${env.LOG_STORE|handlers}
  roleArn:          acs:ram::${vars.accountId}:role/fc-vista-role
  functionSuffix:   ${env.FC_SUFFIX|""}

# Anchor 与 s.yaml / s.realtime-cron.yaml 一致；改一处记得同步另两处。
common-vpc: &common-vpc
  vpcId: ${vars.vpcId}
  vswitchIds:
    - ${vars.vswitchId}
  securityGroupId: ${vars.securityGroupId}

common-nas: &common-nas
  userId: 10003
  groupId: 10003
  mountPoints:
    - serverAddr: ${vars.nasMountTarget}
      mountDir:   /mnt/vista-cache

common-log: &common-log
  project:  ${vars.logProject}
  logstore: ${vars.logStore}
  enableRequestMetrics: true

common-env: &common-env
  OSS_REGION:           ${vars.region}
  OSS_BUCKET:           ${vars.ossBucket}
  NAS_CACHE_ROOT:       /mnt/vista-cache
  VISTA_DB_TYPE:        ${env.VISTA_DB_TYPE|"duckdb"}
  DUCKDB_PATH:          ${env.DUCKDB_PATH|"/mnt/vista-cache/factor.duckdb"}
  VISTA_RESEARCH_PATH:  ${env.VISTA_RESEARCH_PATH|"/mnt/vista-cache/research"}
  CLICKHOUSE_DSN:       ${env.CLICKHOUSE_DSN|""}
  CZSC_TOKEN:           ${env.CZSC_TOKEN|""}
  CZSC_DATA_API:        ${env.CZSC_DATA_API|"https://api.zbczsc.com"}
  LOG_FORMAT:           json
  TZ:                   Asia/Shanghai

common-container: &common-container
  image:   ${vars.imageRegistry}:${vars.imageTag}
  command: ["python", "-m", "vista_fc.runtime.adapter"]
  port:    9000

resources:
  vista-realtime-event:
    component: fc3
    props:
      region: ${vars.region}
      function:
        functionName: vista-realtime-event${vars.functionSuffix}
        runtime: custom-container
        role: ${vars.roleArn}
        timeout: 360
        memorySize: 4096
        cpu: 1
        diskSize: 512
        vpcConfig: *common-vpc
        nasConfig: *common-nas
        logConfig: *common-log
        environmentVariables:
          <<: *common-env
        customContainerConfig:
          <<: *common-container
          args: ["handlers.vista_realtime:handler"]
      # 故意不挂 triggers — 调用方走 fc3 InvokeFunction SDK / 函数 URL 直调。
      # 如果之后想加 HTTP / OSS / MQ 触发，独立再做一份 yaml 或在这里追加 triggers。
      #
      # 预留实例：始终 N 个暖容器，把冷启动 5-15s 压到 ~0s。
      # alwaysAllocateCPU=true 让 FC 空闲时也保留 vCPU，第二次调用没有重新分配延迟。
      # target=0 等同关闭预留（也可 s remove -t s.realtime-event.yaml）。
      provisionConfig:
        qualifier: LATEST
        target: ${env.REALTIME_PROVISION_TARGET|1}
        alwaysAllocateCPU: true
